<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cataloguethisthat</title>
  <meta http-equiv="refresh" content="0; url=/free/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#12141A; --paper:#F5F1E6; --cobalt:#2F6BFF; --ember:#FF6B2C; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 20%, #1a2030, var(--ink) 70%);
      color: var(--paper); font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .wrap { width: min(520px, 100%); text-align: center; }
    .brand {
      font-family: Inter, sans-serif; font-weight: 700; font-size: clamp(28px, 6vw, 42px);
      letter-spacing: 0.5px; margin: 0 0 8px;
    }
    .kicker {
      font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 3px;
      color: #9AA0AC; margin-bottom: 28px;
    }
    .card {
      display: block; text-decoration: none; color: inherit;
      border: 3px solid #2A2F3A; background: #1A1D24; padding: 22px 20px;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--cobalt); background: #20242E; }
    .game {
      font-family: Inter, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 1px;
      color: var(--cobalt); margin: 0 0 6px;
    }
    .blurb {
      font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: 0.4px;
      color: #9AA0AC; line-height: 1.45; margin: 0;
    }
    .path {
      margin-top: 18px; font-family: "Space Mono", monospace; font-size: 11px;
      letter-spacing: 1px; color: #9AA0AC;
    }
    a.direct { color: var(--ember); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">Cataloguethisthat</h1>
    <div class="kicker">GAME CATALOGUE</div>
    <a class="card" href="/free/">
      <div class="game">MATCH ROOM</div>
      <p class="blurb">Arena shooter · ranks · shop · squads</p>
    </a>
    <p class="path">Direct: <a class="direct" href="/free/">cataloguethisthat.github.io/free</a></p>
  </div>
</body>
</html>
